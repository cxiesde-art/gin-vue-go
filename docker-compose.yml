services:
  identity:
    build:
      context: .
      args:
        BINARY: identity-server
        COMMAND: ./cmd/identity-server
    command: ["/app/identity-server"]
    environment:
      BLOG_DATABASE_URL: /data/blog.db
    volumes:
      - blog-data:/data
    expose:
      - "9091"

  content:
    build:
      context: .
      args:
        BINARY: content-server
        COMMAND: ./cmd/content-server
    command: ["/app/content-server"]
    environment:
      BLOG_DATABASE_URL: /data/blog.db
    volumes:
      - blog-data:/data
    expose:
      - "9090"

  comments:
    build:
      context: .
      args:
        BINARY: comment-server
        COMMAND: ./cmd/comment-server
    command: ["/app/comment-server"]
    environment:
      BLOG_DATABASE_URL: /data/blog.db
    volumes:
      - blog-data:/data
    expose:
      - "9092"

  api:
    build: .
    depends_on:
      - content
      - identity
      - comments
    environment:
      BLOG_DATABASE_URL: /data/blog.db
      BLOG_CONTENT_GRPC_ADDRESS: content:9090
      BLOG_IDENTITY_GRPC_ADDRESS: identity:9091
      BLOG_COMMENT_GRPC_ADDRESS: comments:9092
      BLOG_JWT_SECRET: change-this-in-production
    ports:
      - "8080:8080"
    volumes:
      - blog-data:/data

  worker:
    build:
      context: .
      args:
        BINARY: outbox-worker
        COMMAND: ./cmd/outbox-worker
    command: ["/app/outbox-worker"]
    depends_on:
      - content
    environment:
      BLOG_DATABASE_URL: /data/blog.db
      BLOG_OUTBOX_INTERVAL: 1s
    volumes:
      - blog-data:/data

volumes:
  blog-data:
